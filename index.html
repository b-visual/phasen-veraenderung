<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phasen in der Veränderung</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f5f5f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  h1 {
    font-family: Georgia, serif;
    font-size: 1.1rem;
    color: #333;
    margin-bottom: 12px;
    letter-spacing: 0.03em;
  }

  .hint {
    font-size: 0.78rem;
    color: #888;
    margin-bottom: 16px;
  }

  .map-wrapper {
    position: relative;
    width: 100%;
    max-width: 900px;
  }

  .map-wrapper img {
    width: 100%;
    display: block;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  }

  /* Hotspot dots */
  .dot {
    position: absolute;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #1a4fa0;
    border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    transform: translate(-50%, -50%);
    transition: transform 0.15s, background 0.15s;
    z-index: 10;
  }

  .dot:hover {
    transform: translate(-50%, -50%) scale(1.25);
    background: #e87c1e;
  }

  .dot.active {
    background: #e87c1e;
    box-shadow: 0 0 0 4px rgba(232,124,30,0.35);
  }

  /* Pulse ring */
  .dot::after {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid rgba(26,79,160,0.4);
    animation: pulse 2s ease-out infinite;
  }

  @keyframes pulse {
    0%   { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.7); }
  }

  /* Popup */
  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .popup-overlay.open {
    display: flex;
  }

  .popup {
    background: #fff;
    border-radius: 16px;
    padding: 28px 28px 24px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.22);
    position: relative;
    animation: popIn 0.2s ease;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .popup-step {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #e87c1e;
    margin-bottom: 4px;
  }

  .popup-title {
    font-family: Georgia, serif;
    font-size: 1.4rem;
    color: #1a1a2e;
    margin-bottom: 14px;
    line-height: 1.2;
  }

  .popup-text {
    font-size: 0.88rem;
    color: #555;
    line-height: 1.65;
    border-left: 3px solid #e87c1e;
    padding-left: 12px;
    font-style: italic;
  }

  .popup-close {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: #aaa;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .popup-close:hover { color: #333; }

  .popup-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    gap: 8px;
  }

  .nav-btn {
    flex: 1;
    padding: 8px 12px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    cursor: pointer;
    font-size: 0.8rem;
    color: #444;
    transition: background 0.15s, border-color 0.15s;
  }

  .nav-btn:hover {
    background: #f0f0f0;
    border-color: #bbb;
  }

  .nav-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .step-counter {
    text-align: center;
    font-size: 0.75rem;
    color: #aaa;
    margin-top: 14px;
  }

  .popup-measures-title {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #1a4fa0;
    margin: 16px 0 8px;
  }

  .popup-measures {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .popup-measures li {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 0.83rem;
    color: #333;
    line-height: 1.5;
  }

  .popup-measures li::before {
    content: '→';
    color: #e87c1e;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .popup-body {
    max-height: 52vh;
    overflow-y: auto;
    padding-right: 4px;
  }

  .popup-body::-webkit-scrollbar { width: 4px; }
  .popup-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
</style>
</head>

  }

  function closePopup() {
    overlay.classList.remove('open');
    dots.forEach(d => d.classList.remove('active'));
  }

  dots.forEach(dot => {
    dot.addEventListener('click', () => openPopup(parseInt(dot.dataset.index)));
  });

  document.getElementById('closeBtn').addEventListener('click', closePopup);
  overlay.addEventListener('click', e => { if (e.target === overlay) closePopup(); });

  prevBtn.addEventListener('click', () => {
    if (current > 0) { current--; updatePopup(); dots.forEach(d=>d.classList.remove('active')); dots[current].classList.add('active'); }
  });
  nextBtn.addEventListener('click', () => {
    if (current < phases.length - 1) { current++; updatePopup(); dots.forEach(d=>d.classList.remove('active')); dots[current].classList.add('active'); }
  });

  document.addEventListener('keydown', e => {
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'Escape') closePopup();
    if (e.key === 'ArrowLeft' && current > 0) { current--; updatePopup(); dots.forEach(d=>d.classList.remove('active')); dots[current].classList.add('active'); }
    if (e.key === 'ArrowRight' && current < phases.length-1) { current++; updatePopup(); dots.forEach(d=>d.classList.remove('active')); dots[current].classList.add('active'); }
  });
</script>
</body>
</html>
